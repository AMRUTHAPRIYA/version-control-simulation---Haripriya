<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <title>TalentStream | HP Recruiting Services</title>

    <style>
        /* Base Reset & Core Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9fbfd;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Form Container */
        .login-container {
            max-width: 400px;
            width: 90%;
            margin: 80px auto;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a5568;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        .cta-btn {
            background-color: #3182ce;
            color: #ffffff;
            padding: 15px 35px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 18px;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .cta-btn:hover {
            background-color: #2b6cb0;
        }

        /* Footer Style */
        foote3 {
            display: block;
            background-color: #1a365d;
            color: #a0aec0;
            text-align: center;
            padding: 20px 10%;
            font-size: 14px;
            border-top: 1px solid #2d3748;
        }
    </style>
</head>
<body>

    <!-- Main Content Form Section -->
    <div class="login-container">
        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Login submitted successfully.');">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="cta-btn">Login</button>
        </form>
    </div>

    <!-- Requested Footer Element -->
    <foote3>
        <p>&copy; 2026 TalentStream Recruiting Solutions. All rights reserved.</p>
    </foote3>

</body>
</html>
